# Default values for middlewareapp Helm chart

# Image configuration
image:
  repository: middlewareapp
  tag: latest
  pullPolicy: IfNotPresent

# Replica count
replicaCount: 2

# Service configuration
service:
  type: LoadBalancer
  port: 8000
  targetPort: 8000

# Resource limits and requests
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Health probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables (non-sensitive)
env:
  LLM_BASE_URL: "http://192.168.1.55:1234/v1/"
  LLM_MODEL_NAME: "qwen/qwen3-32"
  LLM_TEMPERATURE: "0.7"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  SENDER_EMAIL: "agent@middlewareapp.com"

# Secrets (sensitive data)
secrets:
  LLM_API_KEY: "sk-dummy"

# Namespace
namespace: middlewareapp
