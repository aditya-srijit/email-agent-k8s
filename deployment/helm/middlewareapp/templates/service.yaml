apiVersion: v1
kind: Service
metadata:
  name: {{ include "middlewareapp.fullname" . }}-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "middlewareapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "middlewareapp.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
  sessionAffinity: None
