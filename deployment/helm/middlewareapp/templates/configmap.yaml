apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "middlewareapp.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "middlewareapp.labels" . | nindent 4 }}
data:
  LLM_BASE_URL: {{ .Values.env.LLM_BASE_URL | quote }}
  LLM_MODEL_NAME: {{ .Values.env.LLM_MODEL_NAME | quote }}
  LLM_TEMPERATURE: {{ .Values.env.LLM_TEMPERATURE | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  SENDER_EMAIL: {{ .Values.env.SENDER_EMAIL | quote }}
